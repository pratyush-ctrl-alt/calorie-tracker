<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calorie Tracker</title>
  <meta name="description" content="Personal calorie and macro logger.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calorie Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="navbar-inner">
      <span class="nav-title" id="nav-title">Today</span>
      <div class="nav-right">
        <button id="sync-chip" class="sync-chip" type="button" data-kind="saved" aria-live="polite">Saved</button>
      </div>
    </div>
    <div id="demo-banner" class="demo-banner" hidden>
      <span><strong>Demo mode.</strong> A sample week. Nothing is sent to your database.</span>
      <button type="button" class="link-btn">Set up</button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

  <noscript><p style="padding:16px">Calorie Tracker needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
